<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LONG BIO COLOR</title>
<link rel="icon" type="image/png" href="https://dl.dir.freefiremobile.com/common/web_event/tweb-event/FFSH/assets-common/ff-logo-icon.png">

<style>
/* Global Styles */
body {
    font-family: 'Segoe UI', sans-serif;
    background-color: #0a0a0a;
    color: #fff;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 700px;
    background: #161616;
    padding: 30px;
    border-radius: 20px;
    border: 1px solid #c3922e;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 30px;
}
.header img {
    width: 50px;
    height: 50px;
    filter: drop-shadow(0 0 5px #ffb400);
}
.header h2 {
    margin: 0;
    color: #ffb400;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 24px;
}

/* Color section */
.color-section {
    background: #202020;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid #333;
}
.palette {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
}
.color-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
    border: 2px solid transparent;
}
.color-btn:hover {
    transform: scale(1.2);
    border-color: #fff;
}
.color-picker {
    margin-top: 10px;
}

/* Editor & preview */
textarea {
    width: 100%;
    height: 120px;
    padding: 15px;
    border: 1px solid #333;
    border-radius: 12px;
    font-size: 16px;
    font-family: 'Consolas', monospace;
    background: #252525;
    color: #fff;
    resize: none;
}
.char-counter {
    text-align: right;
    font-size: 12px;
    color: #ffb400;
    margin: 5px 0 15px 0;
}
.preview {
    background: #000;
    color: #fff;
    padding: 20px;
    border-radius: 12px;
    min-height: 60px;
    font-size: 18px;
    line-height: 1.4;
    border: 1px solid #333;
    word-break: break-word;
}

/* Buttons */
.controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
}
button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    text-transform: uppercase;
    transition: 0.3s;
}
.btn-b {
    background: #333;
    color: #fff;
    border: 1px solid #444;
}
.btn-b:hover {
    transform: translateY(-2px);
}

/* Status */
#status {
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 15px;
    display: none;
    font-size: 14px;
}

/* Discord link */
.discord-link {
    margin-top: 25px;
    text-align: center;
    font-size: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}
.discord-link img {
    width: 24px;
    height: 24px;
}
.discord-link a {
    color: #7289DA;
    text-decoration: none;
    font-weight: bold;
}
.discord-link a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>
<div class="container">
    <div class="header">
        <img src="https://dl.dir.freefiremobile.com/common/web_event/tweb-event/FFSH/assets-common/ff-logo-icon.png" alt="FF Logo">
        <h2>LONG BIO COLOR</h2>
    </div>

    <div class="color-section">
        <label class="preview-label">Quick Colors</label>
        <div class="palette" id="palette"></div>

        <label class="preview-label">Custom Color</label>
        <input type="color" id="colorPicker" class="color-picker" value="#FF0000">
        <button class="btn-b" onclick="applyCustomColor()">Add Color</button>
    </div>

    <textarea id="editor" placeholder="Type your bio..."></textarea>
    <div id="charCount" class="char-counter">len: 0</div>
    <div id="status"></div>

    <div class="controls">
        <button class="btn-b" onclick="insertFormat('[b]')">B</button>
        <button class="btn-b" onclick="copyBio()">📋 Copy</button>
    </div>

    <label class="preview-label">In-Game Appearance Preview</label>
    <div id="preview" class="preview"></div>

    <div class="discord-link">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" alt="Discord Logo">
        <a href=":https://discord.gg/UxzC23zaZs" target="_blank">Join my Discord</a>
    </div>
</div>

<script>
const colors = ["FFFF00", "00FF00", "FF0000", "0000FF", "00FFFF", "FF00FF", "FF9000", "6E00FF", "CCFF00", "0F7209", "FFD3EF", "FFFFFF", "000000"];
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const statusDiv = document.getElementById('status');
const colorPicker = document.getElementById('colorPicker');

colors.forEach(hex => {
    const btn = document.createElement('div');
    btn.className = 'color-btn';
    btn.style.backgroundColor = '#' + hex;
    btn.onclick = () => applyColor(hex);
    document.getElementById('palette').appendChild(btn);
});

function applyColor(hex) {
    const start = editor.selectionStart;
    const val = editor.value;
    editor.value = val.slice(0, start) + `[${hex}]` + val.slice(start);
    update();
}

function applyCustomColor() {
    const hex = colorPicker.value.replace('#','').toUpperCase();
    applyColor(hex);
}

function insertFormat(tag) {
    const start = editor.selectionStart;
    const val = editor.value;
    editor.value = val.slice(0, start) + tag + val.slice(start);
    update();
}

function update() {
    const text = editor.value;
    document.getElementById('charCount').innerText = "len: " + text.length;
    let visualHTML = text.replace(/\[([A-F0-9]{6})\]/gi, (m, col) => `</span><span style="color:#${col}">`).replace(/\[b\]/g, '<b>');
    preview.innerHTML = "<span>" + visualHTML + "</span>";
}

function copyBio() {
    const text = editor.value;
    if(!text) return showStatus("❌ Bio is empty","#ff4444");
    navigator.clipboard.writeText(text)
        .then(()=>showStatus("✅ Bio copied with color codes!","#28a745"))
        .catch(()=>showStatus("❌ Copy failed","#ff4444"));
}

function showStatus(msg, color){
    statusDiv.style.display="block";
    statusDiv.innerText = msg;
    statusDiv.style.backgroundColor = color;
}

editor.addEventListener('input', update);
update();
</script>
</body>
</html>
